<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>YHBGM Lite · 使用统计</title>
<style>
  /* 深色统计看板: 纯内嵌零外链, 拒绝搜索引擎收录 */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: linear-gradient(160deg, #101418 0%, #171c22 100%);
    color: #dfe6ec; font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    min-height: 100vh; padding: 32px 20px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 18px; font-weight: 600; letter-spacing: 1px; color: #9fc3e8; }
  .sub { color: #6b7683; font-size: 12px; margin: 6px 0 24px; }
  .cards { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
  .card {
    flex: 1; min-width: 160px; padding: 18px 20px; border-radius: 12px;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07);
  }
  .num { font-size: 34px; font-weight: 700; color: #e8eef4; font-variant-numeric: tabular-nums; }
  .lbl { color: #8a95a1; font-size: 12px; margin-top: 4px; }
  h2 { font-size: 13px; color: #9fc3e8; margin: 26px 0 12px; letter-spacing: 1px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { padding: 8px 10px; text-align: left; border-bottom: 1px solid rgba(255,255,255,.06); }
  th { color: #8a95a1; font-weight: 500; }
  .bar {
    height: 6px; border-radius: 3px; margin-top: 5px;
    background: linear-gradient(90deg, #4f8cc9, #7fb3dd);
  }
  button {
    background: #2b3a4a; color: #cfe0ef; border: none; border-radius: 8px;
    padding: 8px 18px; cursor: pointer; font-size: 12px;
  }
  button:hover { background: #35485c; }
  #err { color: #d97b7b; font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>YHBGM Lite · 使用统计</h1>
  <div class="sub">完全匿名数据: 随机编号 + 版本 + 系统类型, 无任何个人信息 · 数据保留于腾讯云 EdgeOne KV</div>

  <div class="cards">
    <div class="card"><div class="num" id="dau">–</div><div class="lbl">今日活跃 (DAU)</div></div>
    <div class="card"><div class="num" id="mau">–</div><div class="lbl">近 30 天活跃</div></div>
  </div>

  <h2>近 30 天活跃曲线</h2>
  <div id="chart"></div>

  <h2>今日版本分布</h2>
  <table id="ver"><thead><tr><th>版本</th><th>数量</th><th style="width:45%">占比</th></tr></thead><tbody></tbody></table>

  <div style="margin-top:24px"><button onclick="load()">刷新数据</button><span id="err"></span></div>
</div>

<script>
// 拉取统计并渲染: 折线用纯 SVG(零依赖), 失败给出提示不白屏
async function load() {
  try {
    const r = await fetch('/api/stats', { cache: 'no-store' });
    const d = await r.json();
    document.getElementById('dau').textContent = d.dauToday;
    document.getElementById('mau').textContent = d.mau;

    // 30 天折线(SVG): 归一化高度, 空数据显示占位
    const max = Math.max(1, ...d.daily.map(x => x.count));
    const W = 800, H = 160, step = W / Math.max(1, d.daily.length - 1);
    const pts = d.daily.map((x, i) =>
      `${(i * step).toFixed(1)},${(H - 10 - (x.count / max) * (H - 30)).toFixed(1)}`);
    document.getElementById('chart').innerHTML =
      `<svg viewBox="0 0 ${W} ${H}" style="width:100%;background:rgba(255,255,255,.03);border-radius:10px">
        <polyline fill="none" stroke="#7fb3dd" stroke-width="2" points="${pts.join(' ')}"/>
        <text x="8" y="18" fill="#6b7683" font-size="11">峰值 ${max}</text>
      </svg>`;

    // 版本分布: 按数量降序 + 占比条
    const rows = Object.entries(d.versions).sort((a, b) => b[1] - a[1]);
    const total = rows.reduce((s, x) => s + x[1], 0) || 1;
    document.querySelector('#ver tbody').innerHTML = rows.map(([v, n]) =>
      `<tr><td>v${v}</td><td>${n}</td><td>
        <div class="bar" style="width:${(n / total * 100).toFixed(1)}%"></div>
        <span style="color:#8a95a1;font-size:11px">${(n / total * 100).toFixed(1)}%</span>
      </td></tr>`).join('') || '<tr><td colspan="3" style="color:#6b7683">暂无数据</td></tr>';
    document.getElementById('err').textContent = '';
  } catch (e) {
    document.getElementById('err').textContent = '加载失败: ' + e;
  }
}
load();
</script>
</body>
</html>
